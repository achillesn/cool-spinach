backend:
  name: github
  repo: achillesn/cool-spinach
  branch: master

media_folder: images
public_folder: /images

collections:
  - name: posts_root
    label: Άρθρα (γενικά)
    folder: _posts
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields: &post_fields
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: string, required: false }
      - { label: Date, name: date, widget: datetime }
      - { label: Featured Image, name: thumb_img_path, widget: image, required: false }
      - { label: Alternative Featured Image, name: content_img_path, widget: image, required: false }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: Category, name: categories, widget: list, required: false }
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Κείμενο, name: body, widget: markdown }

  - name: iconic_hacks
    label: ICONIC HACKS
    folder: _posts/ICONIC HACKS
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields: *post_fields

