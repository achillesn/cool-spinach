backend:
  name: github
  repo: achillesn/cool-spinach
  branch: master

media_folder: images
public_folder: /images

post_fields: &post_fields
  - { label: "Title", name: "title", widget: "string" }
  - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
  - { label: "Date", name: "date", widget: "datetime" }
  - { label: "Featured Image", name: "thumb_img_path", widget: "image", required: false, hint: "Η εικόνα στη λίστα του blog" }
  - { label: "Alternative Featured Image", name: "content_img_path", widget: "image", required: false, hint: "Η εικόνα μέσα στο άρθρο" }
  - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
  - { label: "Canonical URL", name: "canonical_url", widget: "string", required: false }
  - { label: "Category", name: "categories", widget: "list", required: false }
  - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
  - { label: "Κείμενο", name: "body", widget: "markdown" }

collections:
  - { name: posts_root, label: "Άρθρα (γενικά)", folder: "_posts", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: iconic_hacks, label: "ICONIC HACKS", folder: "_posts/ICONIC HACKS", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: paralliloi_kosmoi, label: "ICONIC HACKS / Παράλληλοι Κόσμοι", folder: "_posts/ICONIC HACKS/PARALLILOI KOSMOI", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: virtual_connections, label: "ICONIC HACKS / Virtual Connections III", folder: "_posts/ICONIC HACKS/Virtual Connections III", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: epg, label: "ICONIC HACKS / e-PG", folder: "_posts/ICONIC HACKS/e-PG", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: ephotogames3, label: "ICONIC HACKS / e-photogames 3", folder: "_posts/ICONIC HACKS/e-photogames 3", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: photologoi, label: "ICONIC HACKS / Photologoi", folder: "_posts/ICONIC HACKS/photologoi", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: nevi, label: "NEVI", folder: "_posts/NEVI", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: nena, label: "NEVI / NENA", folder: "_posts/NEVI/NENA", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: random, label: "RANDOM", folder: "_posts/RANDOM", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: studium, label: "StudiUm", folder: "_posts/StudiUm", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: cyclops_eye, label: "THE CYCLOP's EYE", folder: "_posts/THE CYCLOP's EYE", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: anodus, label: "THE CYCLOP's EYE / ANODUS", folder: "_posts/THE CYCLOP's EYE/ANODUS", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}", fields: *post_fields }
  - { name: news, label: "News", folder: "_posts/news", create: true, slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
